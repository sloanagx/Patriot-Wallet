[package]
name = "patriot-wallet-core"
version = "0.1.0"
edition = "2024"

[dependencies]
atomicwrites = "0.4.4"
bdk_esplora = { version = "0.22.2", default-features = false, features = ["blocking-https-rustls"] }
bdk_wallet = "3.1.0"
bip39 = { version = "2.2.2", features = ["rand", "zeroize"] }
bitcoin = "0.32.8"
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"
